; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Build options
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    ; -DLED_TEST          ; uncomment for the red/green/blue LED chase at boot (~17 s)

; Library dependencies
lib_deps =
    ; WiFiManager for ESP8266
    tzapu/WiFiManager @ ^0.16.0

    ; Time libraries
    paulstoffregen/Time @ ^1.6.1
    jchristensen/Timezone @ ^1.2.4

    ; NeoPixel LED control
    makuna/NeoPixelBus @ ^2.7.0

    ; IR Remote for ESP8266
    crankyoldgit/IRremoteESP8266 @ ^2.8.0

    ; Light sensor
    claws/BH1750 @ ^1.3.0

; Uncomment to specify a custom upload port
; upload_port = /dev/cu.wchusbserial201130
upload_speed = 57600
upload_resetmethod = nodemcu
